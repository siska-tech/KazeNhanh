[workspace]
members = ["crates/core", "crates/sudachi", "crates/legacy", "crates/qwen"]
resolver = "2"

[package]
name = "kaze_nhanh"
version = "0.2.0"
edition = "2021"

[features]
default = ["sudachi"]
sudachi = ["dep:kaze_nhanh_sudachi"]
qwen = ["dep:kaze_nhanh_qwen"]
legacy = ["dep:kaze_nhanh_legacy", "dep:tokenizers", "dep:git2"]
mock_inference = ["legacy", "kaze_nhanh_legacy/mock_inference"]

[dependencies]
serde_json = "1"
kaze_nhanh_qwen = { path = "crates/qwen", version = "0.2.0", optional = true }
kaze_nhanh_core = { path = "crates/core", version = "0.2.0" }
kaze_nhanh_sudachi = { path = "crates/sudachi", version = "0.2.0", optional = true }
kaze_nhanh_legacy = { path = "crates/legacy", version = "0.1.0", optional = true }
tokenizers = { version = "0.19", features = ["unstable_wasm"], optional = true }

git2 = { version = "0.18", features = ["vendored-libgit2"], optional = true }

[dev-dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[example]]
name = "primary_baseline"
required-features = ["sudachi"]

[[example]]
name = "evaluate"
required-features = ["sudachi"]

[[example]]
name = "inference_smoke"
required-features = ["legacy"]

[[bench]]
name = "performance"
harness = false
required-features = ["mock_inference"]

[[test]]
name = "nlp_resources"
required-features = ["legacy"]

[[test]]
name = "evaluation_nlp"
required-features = ["sudachi"]

[[test]]
name = "api_workflows"
path = "tests/integration/api_workflows.rs"
required-features = ["mock_inference"]

[[test]]
name = "thread_safety"
path = "tests/concurrency/thread_safety.rs"
required-features = ["mock_inference"]

[[example]]
name = "judge_smoke"
required-features = ["sudachi", "qwen"]

[[example]]
name = "ocr_samples"
required-features = ["sudachi"]

[[example]]
name = "recognize"
required-features = ["sudachi"]

[[example]]
name = "recognition_samples"
required-features = ["sudachi"]

[[example]]
name = "statistics_asset"
required-features = ["sudachi"]

[[example]]
name = "dictionary_snapshot"
required-features = ["sudachi"]
