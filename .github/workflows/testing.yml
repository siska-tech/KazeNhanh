name: KazeNhanh QA Pipeline

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run unit and integration tests
        run: cargo test --all --all-features

      - name: Generate coverage report
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --lcov --output-path coverage/lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

  thread-sanitizer:
    name: Thread Sanitizer Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          profile: minimal
          override: true

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: tsan-${{ runner.os }}

      - name: Run concurrency-focused tests with ThreadSanitizer
        env:
          RUSTFLAGS: "-Z sanitizer=thread"
          RUSTDOCFLAGS: "-Z sanitizer=thread"
        run: |
          cargo +nightly test summarize_with_details_is_thread_safe -- --test-threads=1
          cargo +nightly test git_native_rag_handles_parallel_invocations -- --test-threads=1

  performance:
    name: Performance & Soak Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: bench-${{ runner.os }}

      - name: Run Criterion benchmarks (mock inference)
        env:
          CRITERION_OUTPUT: ${{ github.workspace }}/artifacts/criterion
        run: |
          mkdir -p "$CRITERION_OUTPUT"
          cargo bench --features mock_inference --bench performance -- --sample-size 25 --measurement-time 3 --warm-up-time 1

      - name: Upload Criterion artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-results
          path: artifacts/criterion

      - name: Soak benchmark (short run)
        shell: pwsh
        run: |
          pwsh ./scripts/soak/run_soak.ps1 -DurationMinutes 5 -IntervalSeconds 60

      - name: Upload soak logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-logs
          path: artifacts/soak

