name: KazeNhanh QA Pipeline

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Unit, Integration & Real NLP Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          profile: minimal
          override: true

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Set up pinned Sudachi dictionary
        shell: pwsh
        run: ./scripts/dev/setup-dev.ps1

      - name: Verify production build, real NLP and registered mock workflows
        shell: pwsh
        run: ./scripts/dev/verify.ps1 -Offline

      - name: Run primary screening fixture baseline (no SLM)
        shell: pwsh
        run: |
          cargo run --locked --offline --example primary_baseline -- evaluation/primary-baseline.jsonl artifacts/primary-baseline
          if ($LASTEXITCODE -ne 0) { throw 'Primary baseline failed.' }

      - name: Upload primary reports and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primary-baseline-${{ runner.os }}
          path: artifacts/primary-baseline
          if-no-files-found: error
      - name: Generate coverage report
        if: runner.os == 'Linux'
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --features mock_inference --lcov --output-path coverage/lcov.info

      - name: Upload coverage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  trained-model:
    name: Trained GGUF CPU & Official Tokenizer Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      - uses: Swatinem/rust-cache@v2
      - name: Set up pinned dictionary and trained assets
        shell: pwsh
        run: |
          ./scripts/dev/setup-dev.ps1
          ./scripts/dev/setup-model.ps1
      - name: Run offline production CPU smoke against independent reference IDs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          ./scripts/dev/verify-model.ps1 -ModelPath target/model-smoke/model.gguf -TokenizerPath target/model-smoke/tokenizer.json -ReferenceCasesPath tests/fixtures/smollm2/reference-cases.json -Offline | Tee-Object -FilePath artifacts/trained-model-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trained-model-smoke
          path: artifacts/trained-model-smoke.log
          if-no-files-found: error

  thread-sanitizer:
    name: Thread Sanitizer Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          components: rust-src
          profile: minimal
          override: true

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: tsan-${{ runner.os }}

      - name: Set up pinned Sudachi dictionary
        shell: pwsh
        run: ./scripts/dev/setup-dev.ps1

      - name: Run concurrency-focused tests with ThreadSanitizer
        env:
          RUSTFLAGS: "-Z sanitizer=thread"
          RUSTDOCFLAGS: "-Z sanitizer=thread"
        run: |
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --locked --features mock_inference --test thread_safety -- --test-threads=1
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --locked -p kaze_nhanh_core secondary_tests -- --test-threads=1

  performance:
    name: Performance & Soak Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          profile: minimal
          override: true

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: bench-${{ runner.os }}

      - name: Run Criterion benchmarks (mock inference)
        env:
          CRITERION_OUTPUT: ${{ github.workspace }}/artifacts/criterion
        run: |
          mkdir -p "$CRITERION_OUTPUT"
          cargo bench --features mock_inference --bench performance -- --sample-size 25 --measurement-time 3 --warm-up-time 1

      - name: Upload Criterion artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-results
          path: artifacts/criterion
          if-no-files-found: error

      - name: Soak benchmark (short run)
        shell: pwsh
        run: |
          pwsh ./scripts/soak/run_soak.ps1 -DurationMinutes 5 -IntervalSeconds 60

      - name: Upload soak logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-logs
          path: artifacts/soak
          if-no-files-found: error

