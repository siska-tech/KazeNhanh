name: KazeNhanh QA Pipeline

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Unit, Integration & Real NLP Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          profile: minimal
          override: true

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Set up pinned Sudachi dictionary
        shell: pwsh
        run: ./scripts/dev/setup-dev.ps1

      - name: Verify production build, real NLP and registered mock workflows
        shell: pwsh
        run: ./scripts/dev/verify.ps1 -Offline

      - name: Generate coverage report
        if: runner.os == 'Linux'
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --features mock_inference --lcov --output-path coverage/lcov.info

      - name: Upload coverage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

  thread-sanitizer:
    name: Thread Sanitizer Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          components: rust-src
          profile: minimal
          override: true

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: tsan-${{ runner.os }}

      - name: Set up pinned Sudachi dictionary
        shell: pwsh
        run: ./scripts/dev/setup-dev.ps1

      - name: Run concurrency-focused tests with ThreadSanitizer
        env:
          RUSTFLAGS: "-Z sanitizer=thread"
          RUSTDOCFLAGS: "-Z sanitizer=thread"
        run: |
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --locked --features mock_inference --test thread_safety -- --test-threads=1

  performance:
    name: Performance & Soak Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          profile: minimal
          override: true

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: bench-${{ runner.os }}

      - name: Run Criterion benchmarks (mock inference)
        env:
          CRITERION_OUTPUT: ${{ github.workspace }}/artifacts/criterion
        run: |
          mkdir -p "$CRITERION_OUTPUT"
          cargo bench --features mock_inference --bench performance -- --sample-size 25 --measurement-time 3 --warm-up-time 1

      - name: Upload Criterion artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-results
          path: artifacts/criterion

      - name: Soak benchmark (short run)
        shell: pwsh
        run: |
          pwsh ./scripts/soak/run_soak.ps1 -DurationMinutes 5 -IntervalSeconds 60

      - name: Upload soak logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-logs
          path: artifacts/soak

